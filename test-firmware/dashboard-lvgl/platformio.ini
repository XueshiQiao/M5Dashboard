; PlatformIO config for the LVGL-based dashboard.
;
; Keeps the same pioarduino + M5Unified + M5GFX base used by the M5GFX
; mockup at ../dashboard-mockup/ — M5Unified handles the Tab5 hardware
; (display, touch, audio, IMU, power), LVGL is layered on top via a thin
; bridge in src/lvgl_bridge.cpp.

[env:m5tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = esp32-p4-evboard
framework = arduino

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; LVGL: include lv_conf.h from our include/ dir.
    ; -I makes the dir visible to library compilation (lib_dep'd code) too,
    ; not just our own src/ — without this LVGL fails to find lv_conf.h.
    -I "${PROJECT_DIR}/include"
    -DLV_CONF_INCLUDE_SIMPLE

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

extra_scripts =
    pre:scripts/skip_lvgl_arm_asm.py

lib_deps =
    https://github.com/m5stack/M5Unified.git
    https://github.com/m5stack/M5GFX.git
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.2.1
