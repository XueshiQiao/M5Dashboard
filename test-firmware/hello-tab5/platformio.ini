; PlatformIO config for the M5Stack Tab5 hello-world.
;
; Why pioarduino + esp32-p4-evboard:
;   - As of 2026-04, there is no dedicated "m5tab5" board profile in PlatformIO.
;     The Espressif ESP32-P4 evaluation board profile works fine; we override
;     flash size, PSRAM, partitions, and pull M5Unified to handle the Tab5
;     peripherals (display ST7123, touch, audio, IMU, power).
;   - The pioarduino fork of platform-espressif32 ships ESP32-P4 Arduino core
;     before mainline. Pinned to develop branch.
;
; First build downloads the ESP32-P4 toolchain (~400-500 MB). Subsequent
; builds are cached.

[env:m5tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = esp32-p4-evboard
framework = arduino

; --- flash / memory ---
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi      ; Octal PSRAM
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; --- upload / monitor ---
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- libraries ---
; Pull M5Unified + M5GFX from HEAD so we get the ST7123 display+touch driver
; that landed after Oct 2025. Older library versions won't work on current
; Tab5 units.
lib_deps =
    https://github.com/m5stack/M5Unified.git
    https://github.com/m5stack/M5GFX.git
